<!DOCTYPE html>
<html><head><link rel="stylesheet" href="style.css"></head>
<body>
<h1>🌸 L’Atelier Syne Dashboard</h1>

<div class="panel">
<h2>Shop Settings</h2>
<input id="shop" placeholder="Shop Name">
<input id="tag" placeholder="Tagline">
<input id="fb" placeholder="Facebook Page">
<input id="contact" placeholder="Contact">
<input type="file" id="logoUpload">
<input type="file" id="logoUpload" accept="image/*">
<img id="logoPreview" class="logo-preview">
<button onclick="saveSettings()">Save</button>
</div>

<div class="panel">
<h2>Add Product</h2>
<input id="name" placeholder="Product Name">
<input id="price" placeholder="Price">
<textarea id="desc" placeholder="Description"></textarea>
<input type="file" id="photo">
<button onclick="addProduct()">Add Product</button>
</div>

<div class="panel">
<h2>Customize Options</h2>
<input id="newColor" placeholder="Add flower color">
<button onclick="addColor()">Add Color</button>
<div id="colors"></div>
<input id="newWrapper" placeholder="Add wrapper option">
<button onclick="addWrapper()">Add Wrapper</button>
<div id="wrappers"></div>
<input id="newAddon" placeholder="Add add-on (Chocolate/Card/etc.)">
<button onclick="addAddon()">Add Add-on</button>
<div id="addons"></div>
</div>

<div class="panel">
<h2>Products</h2>
<div id="productList"></div>
</div>

<div class="panel">
<h2>Orders</h2>
<div id="orderList"></div>
</div>

<script src="admin.js"></script>
</body></html>
