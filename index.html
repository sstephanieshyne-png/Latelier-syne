<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L’Atelier Syne</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar">
<img id="logo" src="logo.png">

<div>
<h1 id="shopName">L’Atelier Syne</h1>
<p class="subtitle">Luxury Floral Studio</p>
</div>

<a id="ownerLink" href="admin.html" style="display:none;">
Owner Dashboard
</a>
</header>

<section class="hero">

<div class="heroText">
<h2 id="tagline">
Flowers made for your sweetest moments.
</h2>

<p>
Elegant floral arrangements crafted with love and care.
</p>

<button onclick="document.getElementById('products').scrollIntoView()">
Shop Collection
</button>

</div>

<div class="heroImage">
    <div class="flowerCircle">
        <img src="assets/hero-bouquet.png" alt="Luxury Bouquet">
    </div>
</div>

</section>
<h2>Ready-Made Collection</h2>
<div id="products" class="grid"></div>
</section>
<h2>Your Cart 🛒</h2>

<div id="cart"></div>

<h3 id="total"></h3>


</section>
<section class="custom">

<h2>Customize Your Bouquet 🌸</h2>


<select id="flower">
<option>Rose</option>
</select>


<select id="color">
<option>Loading colors...</option>
</select>


<select id="wrapper">
<option>Loading wrappers...</option>
</select>


<select id="addon">
<option value="">No Add-on</option>
</select>


<textarea 
id="message" 
placeholder="Additional request (Chocolate, Card message, etc.)">
</textarea>


<button onclick="preview()">
Preview Request
</button>


<button onclick="addCustomBouquet()">
Add Custom Bouquet to Cart 🛒
</button>


<div id="customPreview"></div>


</section>

<section>
<h2>Order Details</h2>
<input id="customer" placeholder="Full Name">
<input id="phone" placeholder="Contact Number">
<input id="address" placeholder="Address">

<label>Payment Method</label>
<select id="paymentMethod">
<option>GCash</option>
<option>Cash on Delivery</option>
<option>Bank Transfer</option>
<option>Meet-up Payment</option>
</select>

<textarea id="notes" placeholder="Order Notes"></textarea>
<button onclick="submitOrder()">Submit Order</button>
</section>
  <!-- #2 TRACK ORDER SECTION -->
<section>
<h2>Track Your Order 🌸</h2>

<input id="trackPhone" placeholder="Enter Contact Number">

<button onclick="trackOrder()">
Check Order Status
</button>

<div id="trackResult"></div>

</section>
  
<script>
window.onload=function(){
if (localStorage.getItem("owner") !== "true") {document.getElementById("ownerLink").style.display = "none";}
</script>
<div class="petals" id="petals"></div>
<span>🌸</span>
<span>🌷</span>
<span>🌸</span>
<span>🌺</span>
<span>🌸</span>
</div>
<script>
setTimeout(()=>{
  document.getElementById("petals").remove();
},5000
           </script>
<script type="module" src="app.js"></script>
</body>
</html>
